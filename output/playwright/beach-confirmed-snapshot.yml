                  - generic [ref=e312]: 2 out of 5 stars
                - generic [ref=e313]: 2 months ago
              - blockquote [ref=e314]: “The area was so-so. The small alley leading to the location wasn't properly paved and cemented. The price was extremely expensive with their cottages at ₱1800 and ₱180 per head. Cottage 9 was a wreck. Gladly, it only rained lightly during our visit or else our food would be soaked. We brought a PWD with us and was informed at the admission that they wouldn't offer a discount to PWD as the price was already fixed for the locals. What the heck?! The place didn't bring relaxation as it was too crowded. The price didn't justify the service we received.”
              - generic [ref=e315]:
