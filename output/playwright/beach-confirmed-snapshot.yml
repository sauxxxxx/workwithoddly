                - generic [ref=e299]:
                  - text: ★★★★★
                  - generic [ref=e300]: 5 out of 5 stars
                - generic [ref=e301]: 4 months ago
              - blockquote [ref=e302]: “Great for family and quick swim when I. Cebu. Has a dirt path directly from highway. Units for transient rooms are spacious, needs repair for the shower bath tub. Often would experience rotational brownout, location is tide sensitive so check what time your visit to avoid low tide shoreline.”
              - generic [ref=e303]:
