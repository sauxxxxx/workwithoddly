                - generic [ref=e323]:
                  - text: ★★★★★
                  - generic [ref=e324]: 5 out of 5 stars
                - generic [ref=e325]: 4 months ago
              - blockquote [ref=e326]: “We had so much fun here! The place is very accessible if you are staying around Mactan or Lapu-Lapu. The beach is clean and safe for kids. They have AC rooms for day-use and will give you discounted price for entrance if you get an AC room. The AC was working which allowed yung kids na kasama namen na magnap. They also have barbecue place! Kayak was so much fun too! We loved our stay! 🌊🥰🫶”
              - generic [ref=e327]:
